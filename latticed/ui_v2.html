// ─── Documents View ──────────────────────────────────────────────────────────
function DocumentsView({ apiKey }) {
  const api = useApi(apiKey);
  const [docs, setDocs] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [msg, setMsg] = useState('');
  const fileRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  const refresh = useCallback(() => {
    api('/api/docs').then(d => setDocs(d.documents)).catch(()=>{});
  }, [api]);

  useEffect(refresh, [refresh]);

  const upload = async (file) => {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.md')) {
      setMsg('Only .md files are accepted.');
      return;
    }
    setUploading(true);
    setMsg('');
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch(`${API_BASE}/api/docs/upload`, {
        method: 'POST',
        headers: { 'x-api-key': apiKey },
        body: form,
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || `${res.status}`);
      }
      const data = await res.json();
      setMsg(`Uploaded ${data.filename} (${data.bytes} bytes).`);
      refresh();
    } catch (e) {
      setMsg(`Upload failed: ${e.message}`);
    } finally {
      setUploading(false);
    }
  };

  return (
    <div className="view-fade p-4 lg:p-8">
      <div className="mb-6">
        <div className="section-number">04 — Documents</div>
        <h2 className="text-2xl font-bold mt-1">
          Feed the lattice <span className="accent-italic">context.</span>
        </h2>
        <p className="text-mute text-xs mt-2">
          Drop a .md file here and it becomes available to the Document Ingestion node
          on the next deep-path query.
        </p>
      </div>

      <div
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={e => {
          e.preventDefault();
          setDragOver(false);
          if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
        }}
        onClick={() => fileRef.current?.click()}
        className={`bg-slate border-2 border-dashed p-8 text-center cursor-pointer transition mb-6 ${
          dragOver ? 'border-accent bg-ink' : 'border-line hover:border-mute'
        }`}
      >
        <div className="text-3xl mb-2 opacity-40">↑</div>
        <div className="text-sm text-paper">
          {uploading ? 'Uploading…' : dragOver ? 'Drop to upload' : 'Drop a .md file here or click to browse'}
        </div>
        <input
          ref={fileRef}
          type="file"
          accept=".md,text/markdown"
          className="hidden"
          onChange={e => upload(e.target.files?.[0])}
        />
      </div>
      {msg && <div className="text-xs text-accent mb-4">{msg}</div>}

      <div className="flex items-baseline justify-between mb-3">
        <div className="section-number">Current Workspace</div>
        <button
          onClick={refresh}
          className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-1"
        >
          ↻ Refresh
        </button>
      </div>
      <div className="bg-slate border border-line">
        {docs.length === 0 && (
          <div className="p-6 text-mute text-sm">No documents yet.</div>
        )}
        {docs.map((d, i) => (
          <div key={i} className="p-4 border-b border-line last:border-b-0 flex items-baseline justify-between">
            <span className="text-sm font-mono text-paper">{d.filename}</span>
            <span className="text-[10px] text-mute">
              {(d.bytes / 1024).toFixed(1)} KB · {new Date(d.modified_epoch * 1000).toLocaleString()}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Refine View — Active Learning Question Loop ────────────────────────────
function RefineView({ apiKey, onPendingChange }) {
  const api = useApi(apiKey);
  const [questions, setQuestions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(null);   // question id currently being answered

  const load = useCallback(() => {
    setLoading(true);
    setErr('');
    api('/api/questions/pending').then(d => {
      setQuestions(d.questions || []);
      setLoading(false);
      if (onPendingChange) onPendingChange(d.pending_count || 0);
    }).catch(e => { setErr(e.message); setLoading(false); });
  }, [api, onPendingChange]);

  useEffect(load, [load]);

  const answer = async (q, choice) => {
    setBusy(q.id);
    try {
      const url = choice === 'skip'
        ? `${API_BASE}/api/questions/${q.id}`
        : `${API_BASE}/api/questions/${q.id}/answer?answer=${encodeURIComponent(choice)}`;
      const res = await fetch(url, {
        method: choice === 'skip' ? 'DELETE' : 'POST',
        headers: { 'x-api-key': apiKey },
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || `${res.status}`);
      }
      setQuestions(prev => prev.filter(x => x.id !== q.id));
      if (onPendingChange) onPendingChange(Math.max(0, (questions.length - 1)));
    } catch (e) {
      setErr(`Answer failed: ${e.message}`);
    } finally {
      setBusy(null);
    }
  };

  return (
    <div className="view-fade p-4 lg:p-8">
      <div className="mb-6 flex items-baseline justify-between gap-3 flex-wrap">
        <div>
          <div className="section-number">06 — Refine</div>
          <h2 className="text-2xl font-bold mt-1">
            Teach the lattice <span className="accent-italic">how you think.</span>
          </h2>
          <p className="text-mute text-xs mt-2 max-w-2xl">
            When the system isn't sure how to categorize a memory, it asks instead
            of guessing. Your answer updates the memory's tags and helps me
            learn how you describe your own life. Skip anything you don't want
            to answer — nothing is forced.
          </p>
        </div>
        <button
          onClick={load}
          className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-2"
        >
          ↻ Refresh
        </button>
      </div>
      {err && <div className="text-err text-xs mb-3 font-mono">{err}</div>}
      <div className="space-y-3">
        {loading && <div className="bg-slate border border-line p-6 text-mute text-sm">Loading…</div>}
        {!loading && questions.length === 0 && (
          <div className="bg-slate border border-line p-8 text-center">
            <div className="text-3xl mb-2 opacity-30">◇</div>
            <div className="text-paper text-sm font-medium">All caught up.</div>
            <div className="text-mute text-xs mt-2 max-w-md mx-auto">
              No questions waiting. As you have more conversations, the system
              will queue questions here when categorization is ambiguous.
            </div>
          </div>
        )}
        {questions.map(q => (
          <div key={q.id} className="bg-slate border border-line p-4 lg:p-5">
            <div className="flex items-baseline justify-between mb-3">
              <div className="section-number">{q.question_type || 'question'}</div>
              <div className="text-[10px] text-mute font-mono">
                {new Date(q.created_at_epoch * 1000).toLocaleString()}
              </div>
            </div>
            <div className="text-[10px] uppercase tracking-widest text-mute mb-1">Memory</div>
            <div className="text-sm text-paper mb-4 italic">
              "{q.memory_preview || '(no preview)'}"
            </div>
            <div className="text-sm text-paper mb-3">{q.question_text}</div>
            <div className="flex flex-wrap gap-2">
              {q.options.map(opt => (
                <button
                  key={opt}
                  onClick={() => answer(q, opt)}
                  disabled={busy === q.id}
                  className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent hover:bg-accent/10 transition px-4 py-2 disabled:opacity-40 disabled:cursor-not-allowed"
                  title={
                    q.scores && q.scores[opt] !== undefined
                      ? `Score: ${q.scores[opt].toFixed(3)}`
                      : opt
                  }
                >
                  {opt}
                </button>
              ))}
              <button
                onClick={() => answer(q, 'skip')}
                disabled={busy === q.id}
                className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-mute hover:border-mute hover:text-paper transition px-4 py-2 disabled:opacity-40"
              >
                Skip
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Cache View ──────────────────────────────────────────────────────────────
function CacheView({ apiKey }) {
  const api = useApi(apiKey);
  const [entries, setEntries] = useState([]);
  const [threshold, setThreshold] = useState(0.98);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [confirmId, setConfirmId] = useState(null);
  const [forgetting, setForgetting] = useState(null);
  const [confirmAll, setConfirmAll] = useState(false);
  const [forgettingAll, setForgettingAll] = useState(false);
  const [expandedId, setExpandedId] = useState(null);

  const load = useCallback(() => {
    setLoading(true);
    setErr('');
    api('/api/cache').then(d => {
      setEntries(d.entries || []);
      setThreshold(d.threshold);
      setLoading(false);
    }).catch(e => { setErr(e.message); setLoading(false); });
  }, [api]);

  useEffect(load, [load]);

  const forget = async (id) => {
    setForgetting(id);
    try {
      const res = await fetch(`${API_BASE}/api/cache/${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: { 'x-api-key': apiKey },
      });
      if (!res.ok) throw new Error(await res.text() || `${res.status}`);
      setEntries(prev => prev.filter(e => e.id !== id));
      setConfirmId(null);
    } catch (e) {
      setErr(`Forget failed: ${e.message}`);
    } finally {
      setForgetting(null);
    }
  };

  const forgetAll = async () => {
    setForgettingAll(true);
    setErr('');
    try {
      const res = await fetch(`${API_BASE}/api/cache?confirm=true`, {
        method: 'DELETE',
        headers: { 'x-api-key': apiKey },
      });
      if (!res.ok) throw new Error(await res.text() || `${res.status}`);
      const data = await res.json();
      setEntries([]);
      setConfirmAll(false);
      setErr(`✓ Cleared ${data.deleted_count} cache entr${data.deleted_count !== 1 ? 'ies' : 'y'}.`);
      setTimeout(() => setErr(''), 4000);
    } catch (e) {
      setErr(`Forget All failed: ${e.message}`);
    } finally {
      setForgettingAll(false);
    }
  };

  const fmtAge = (sec) => {
    if (sec == null) return '—';
    if (sec < 60) return `${Math.floor(sec)}s`;
    if (sec < 3600) return `${Math.floor(sec / 60)}m`;
    if (sec < 86400) return `${Math.floor(sec / 3600)}h`;
    return `${Math.floor(sec / 86400)}d`;
  };

  return (
    <div className="view-fade p-4 lg:p-8">
      <div className="mb-6 flex items-baseline justify-between gap-3 flex-wrap">
        <div>
          <div className="section-number">05 — Cache</div>
          <h2 className="text-2xl font-bold mt-1">
            Semantic <span className="accent-italic">cache.</span>
          </h2>
          <p className="text-mute text-xs mt-2">
            Verified responses cached at cosine similarity {threshold.toFixed(2)} threshold.
            Financial plans expire after 30 days, conversational responses after 24 hours.
            Click <span className="text-accent">Forget</span> to purge a contaminated or stale entry.
          </p>
        </div>
        <div className="flex gap-2 items-center flex-wrap">
          <button
            onClick={load}
            className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-2"
          >
            ↻ Refresh
          </button>
          {!confirmAll ? (
            <button
              onClick={() => setConfirmAll(true)}
              disabled={entries.length === 0}
              className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-err hover:text-err transition px-3 py-2 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:border-line disabled:hover:text-paper"
              title="Wipe the entire semantic cache — for dev/test workflows"
            >
              ⚠ Forget All
            </button>
          ) : (
            <div className="flex gap-2 items-center bg-ink border border-err px-2 py-1">
              <span className="text-[10px] uppercase tracking-wider text-err font-bold">
                Delete all {entries.length}?
              </span>
              <button
                onClick={forgetAll}
                disabled={forgettingAll}
                className="text-[10px] uppercase tracking-wider font-bold bg-err text-paper px-3 py-1 hover:opacity-80 transition disabled:opacity-50"
              >
                {forgettingAll ? '…' : 'Confirm'}
              </button>
              <button
                onClick={() => setConfirmAll(false)}
                className="text-[10px] uppercase tracking-wider font-bold border border-line text-mute px-3 py-1 hover:text-paper transition"
              >
                Cancel
              </button>
            </div>
          )}
        </div>
      </div>
      {err && <div className="text-err text-xs mb-2 font-mono">{err}</div>}
      <div className="bg-slate border border-line">
        {loading && <div className="p-6 text-mute text-sm">Loading…</div>}
        {!loading && entries.length === 0 && (
          <div className="p-6 text-mute text-sm">Cache is empty. Send a few prompts and verified responses will accumulate here.</div>
        )}
        {entries.map(e => (
          <div key={e.id} className="p-4 border-b border-line last:border-b-0">
            <div className="flex items-start justify-between gap-3 mb-2">
              <div className="flex-1 min-w-0">
                <div className="text-sm text-paper line-clamp-2 mb-1">
                  <span className="text-mute text-[10px] uppercase tracking-widest mr-2">Prompt:</span>
                  {e.prompt || <em className="text-mute">(empty)</em>}
                </div>
                <div
                  className="text-xs text-mute cursor-pointer hover:text-paper transition"
                  onClick={() => setExpandedId(expandedId === e.id ? null : e.id)}
                >
                  <span className="text-[10px] uppercase tracking-widest mr-2 text-mute">Response:</span>
                  {expandedId === e.id
                    ? <span className="whitespace-pre-wrap text-paper">{e.response_preview}</span>
                    : <span className="line-clamp-1">{e.response_preview}</span>
                  }
                  {!expandedId === e.id && e.response_preview.length >= 240 && <span className="text-mute"> …</span>}
                </div>
              </div>
              {confirmId === e.id ? (
                <div className="flex gap-2 flex-shrink-0">
                  <button
                    onClick={() => forget(e.id)}
                    disabled={forgetting === e.id}
                    className="text-[10px] uppercase tracking-wider font-bold bg-err text-paper px-3 py-1 hover:opacity-80 transition disabled:opacity-50"
                  >
                    {forgetting === e.id ? '…' : 'Confirm Forget'}
                  </button>
                  <button
                    onClick={() => setConfirmId(null)}
                    className="text-[10px] uppercase tracking-wider font-bold border border-line text-mute px-3 py-1 hover:text-paper transition"
                  >
                    Cancel
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setConfirmId(e.id)}
                  className="text-[10px] uppercase tracking-wider font-semibold border border-line text-mute hover:border-err hover:text-err transition px-3 py-1 flex-shrink-0"
                  title="Purge this cache entry"
                >
                  Forget
                </button>
              )}
            </div>
            <div className="flex flex-wrap items-center gap-3 text-[10px] text-mute">
              <span className="uppercase tracking-widest">Intent: <span className="text-accent ml-1">{e.intent || '—'}</span></span>
              <span>·</span>
              <span>Age: <span className="text-paper">{fmtAge(e.age_seconds)}</span></span>
              <span>·</span>
              <span>TTL Left: <span className={e.expired ? 'text-err' : 'text-paper'}>{fmtAge(e.ttl_remaining_seconds)}</span></span>
              {e.expired && <span className="text-err">·  EXPIRED</span>}
              <span>·</span>
              <span className="font-mono opacity-50">#{e.id.slice(0, 8)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Settings View ───────────────────────────────────────────────────────────
function SettingsView({ apiKey, onLogout, health }) {
  const api = useApi(apiKey);
  const [stats, setStats] = useState(null);
  const [err, setErr] = useState('');
  // Sprint 44 — device pairing UI
  const [devices, setDevices] = useState([]);
  const [pairCode, setPairCode] = useState('');
  const [pairExpiresAt, setPairExpiresAt] = useState(0);
  const [pairBusy, setPairBusy] = useState(false);
  // Sprint 55 — v2 engine status + reflection
  const [v2Stats, setV2Stats] = useState(null);
  const [v2ReflectMsg, setV2ReflectMsg] = useState('');
  const [v2ReflectBusy, setV2ReflectBusy] = useState(false);

  const load = useCallback(() => {
    setErr('');
    api('/api/stats').then(setStats).catch(e => setErr(e.message));
    api('/api/devices').then(d => setDevices(d.devices || [])).catch(() => {});
    api('/api/v2/stats').then(setV2Stats).catch(() => setV2Stats(null));
  }, [api]);

  useEffect(load, [load]);

  const runReflection = async () => {
    setV2ReflectBusy(true); setV2ReflectMsg('');
    try {
      const r = await fetch(`${API_BASE}/api/v2/reflect`, {
        method: 'POST',
        headers: { 'x-api-key': apiKey },
      });
      if (!r.ok) throw new Error(`${r.status}`);
      const report = await r.json();
      setV2ReflectMsg(
        `Processed ${report.turns_processed} turn(s). ` +
        `+${report.entities_created} entities, ` +
        `+${report.relations_created} relations, ` +
        `+${report.events_created} events. ` +
        `${report.proposals_deferred} deferred.`
      );
      // Refresh stats so the kstore counts update.
      api('/api/v2/stats').then(setV2Stats).catch(() => {});
    } catch (e) {
      setV2ReflectMsg(`Reflection failed: ${e.message}`);
    } finally {
      setV2ReflectBusy(false);
    }
  };

  const generatePairCode = async () => {
    setPairBusy(true); setErr('');
    try {
      const r = await fetch(`${API_BASE}/api/pair/code`, {
        method: 'POST',
        headers: { 'x-api-key': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ label_hint: 'new device' }),
      });
      if (!r.ok) throw new Error(`Pair code request failed (${r.status})`);
      const { code, expires_in } = await r.json();
      setPairCode(code);
      setPairExpiresAt(Date.now() + expires_in * 1000);
    } catch (e) {
      setErr(e.message);
    } finally {
      setPairBusy(false);
    }
  };

  const revokeDevice = async (prefix) => {
    setErr('');
    try {
      const r = await fetch(`${API_BASE}/api/devices/${encodeURIComponent(prefix.replace(/\.\.\.$/, ''))}`, {
        method: 'DELETE',
        headers: { 'x-api-key': apiKey },
      });
      if (!r.ok) throw new Error(`Revoke failed (${r.status})`);
      load();
    } catch (e) {
      setErr(e.message);
    }
  };

  return (
    <div className="view-fade p-4 lg:p-8">
      <div className="mb-6 flex items-baseline justify-between gap-3 flex-wrap">
        <div>
          <div className="section-number">05 — Settings</div>
          <h2 className="text-2xl font-bold mt-1">
            System <span className="accent-italic">status.</span>
          </h2>
        </div>
        <button
          onClick={load}
          className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-2"
        >
          ↻ Refresh
        </button>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="bg-slate border border-line p-4">
          <div className="section-number mb-3">Server Health</div>
          <div className="space-y-2 text-sm">
            <div className="flex justify-between"><span className="text-mute">Status</span><span className={health?.status === 'ok' ? 'text-ok' : 'text-err'}>{health?.status || '—'}</span></div>
            <div className="flex justify-between"><span className="text-mute">ChromaDB</span><span className={health?.chroma ? 'text-ok' : 'text-err'}>{health?.chroma ? '✓ online' : '✗ offline'}</span></div>
            <div className="flex justify-between"><span className="text-mute">Tavily</span><span className={health?.tavily ? 'text-ok' : 'text-warn'}>{health?.tavily ? '✓ online' : '⚠ no key set'}</span></div>
          </div>
        </div>

        <div className="bg-slate border border-line p-4">
          <div className="section-number mb-3">Last Interaction</div>
          {stats?.last_interaction ? (
            <div className="space-y-2 text-sm">
              <div className="flex justify-between"><span className="text-mute">Intent</span><span>{stats.last_interaction.intent}</span></div>
              <div className="flex justify-between"><span className="text-mute">Path</span><span>{stats.last_interaction.path}</span></div>
              <div className="flex justify-between"><span className="text-mute">Loop count</span><span>{stats.last_interaction.loop_count}</span></div>
              <div className="flex justify-between"><span className="text-mute">Total latency</span><span className="font-mono">{stats.last_interaction.total_latency_ms} ms</span></div>
            </div>
          ) : <div className="text-mute text-sm">No interactions yet.</div>}
        </div>

        {/* Sprint 55 — v2 engine status + reflection trigger */}
        <div className="bg-slate border border-line p-4 lg:col-span-2">
          <div className="section-number mb-3">v2 Engine (beta)</div>
          <p className="text-xs text-mute mb-3 leading-relaxed">
            v2 is the typed pipeline (kstore + perception + strategies + reviewer).
            Toggle it from the chat header. Reflection processes recent v2 turns
            into the knowledge store.
          </p>
          {v2Stats ? (
            <div className="grid grid-cols-2 gap-4 text-sm mb-4">
              <div>
                <div className="text-mute text-[10px] uppercase tracking-widest mb-1">KStore</div>
                <div className="text-paper">{v2Stats.kstore?.live_entities ?? '—'} entities</div>
                <div className="text-paper">{v2Stats.kstore?.live_events ?? '—'} events</div>
                <div className="text-paper">{v2Stats.kstore?.live_relations ?? '—'} relations</div>
                {v2Stats.kstore?.legacy_beliefs > 0 && (
                  <div className="text-mute text-xs">+ {v2Stats.kstore.legacy_beliefs} legacy beliefs</div>
                )}
              </div>
              <div>
                <div className="text-mute text-[10px] uppercase tracking-widest mb-1">Turns</div>
                <div className="text-paper">{v2Stats.turns?.total ?? '—'} total</div>
                <div className={v2Stats.turns?.unprocessed > 0 ? 'text-accent' : 'text-paper'}>
                  {v2Stats.turns?.unprocessed ?? '—'} unprocessed
                </div>
                <div className="text-mute text-xs mt-1">
                  backend: {v2Stats.backend_attached ? '✓ attached' : '✗ none'}
                </div>
              </div>
            </div>
          ) : (
            <div className="text-mute text-sm mb-4">v2 stats unavailable — server may not have v2 enabled.</div>
          )}
          <button
            onClick={runReflection}
            disabled={v2ReflectBusy || !v2Stats}
            className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-2 disabled:opacity-40 min-h-[44px]"
          >
            {v2ReflectBusy ? 'Reflecting…' : '↻ Run reflection now'}
          </button>
          {v2ReflectMsg && (
            <div className="text-mute text-xs mt-3">{v2ReflectMsg}</div>
          )}
        </div>

        <div className="bg-slate border border-line p-4 lg:col-span-2">
          <div className="section-number mb-3">Recent Node Latency</div>
          {stats?.hardware_latency_log?.length ? (
            <div className="space-y-1 text-xs font-mono">
              {stats.hardware_latency_log.map((h, i) => (
                <div key={i} className="flex justify-between border-b border-line/50 py-1">
                  <span className="text-paper">{h.node}</span>
                  <span className="text-mute">{h.latency_ms} ms</span>
                </div>
              ))}
            </div>
          ) : <div className="text-mute text-sm">No hardware log entries yet.</div>}
        </div>

        <div className="bg-slate border border-line p-4 lg:col-span-2">
          <div className="section-number mb-3">Paired Devices</div>
          <p className="text-xs text-mute mb-3 leading-relaxed">
            Generate a 6-digit code to pair a new phone or tablet. The code is
            valid for 10 minutes and is consumed on first use. Each paired
            device gets a token that can be revoked here.
          </p>
          {pairCode ? (
            <div className="bg-ink border border-accent p-4 mb-3 text-center">
              <div className="text-mute text-xs uppercase tracking-widest">Pairing Code</div>
              <div className="text-accent text-3xl font-mono tracking-[0.3em] mt-2">{pairCode}</div>
              <div className="text-mute text-[10px] mt-2">
                Expires in {Math.max(0, Math.floor((pairExpiresAt - Date.now()) / 1000))}s
              </div>
            </div>
          ) : null}
          <button
            onClick={generatePairCode}
            disabled={pairBusy}
            className="text-xs font-semibold uppercase tracking-wider border border-line bg-ink text-paper hover:border-accent hover:text-accent transition px-3 py-2 disabled:opacity-40 min-h-[44px]"
          >
            {pairBusy ? 'Generating…' : (pairCode ? '↻ New code' : 'Pair new device')}
          </button>

          {devices.length > 0 && (
            <div className="mt-4 space-y-2">
              {devices.map(d => (
                <div key={d.token_prefix} className="flex items-center justify-between border border-line bg-ink/40 p-3 text-sm">
                  <div className="min-w-0">
                    <div className="text-paper truncate">{d.label}</div>
                    <div className="text-mute text-[10px] font-mono">
                      {d.token_prefix} · last seen {d.last_seen_at ? new Date(d.last_seen_at * 1000).toLocaleString() : 'never'}
                    </div>
                  </div>
                  <button
                    onClick={() => revokeDevice(d.token_prefix)}
                    className="text-xs text-err hover:text-paper transition px-3 py-2 min-h-[44px]"
                  >Revoke</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="bg-slate border border-line p-4 lg:col-span-2">
          <div className="section-number mb-3">Repository</div>
          <a
            href="https://github.com/earlpete222-sys/LatticeD"
            target="_blank" rel="noopener noreferrer"
            className="text-sm text-accent hover:text-paper transition"
          >
            github.com/earlpete222-sys/LatticeD →
          </a>
        </div>
      </div>

      <div className="mt-8 text-center">
        <button onClick={onLogout} className="text-xs text-mute hover:text-err transition">
          Disconnect from Lattice
        </button>
      </div>
      {err && <div className="text-err text-xs mt-4">{err}</div>}
    </div>
  );
}

// ─── App Root ────────────────────────────────────────────────────────────────
// Sprint 44 — single source of truth for the saved auth credential. Stored
// in localStorage so a phone (or refreshed browser) auto-reconnects without
// retyping the API key or re-pairing. Cleared on Disconnect.
const STORAGE_KEY = 'latticed_api_key';
function loadStoredKey() {
  try { return window.localStorage.getItem(STORAGE_KEY) || null; }
  catch { return null; }
}
function persistKey(k) {
  try {
    if (k) window.localStorage.setItem(STORAGE_KEY, k);
    else window.localStorage.removeItem(STORAGE_KEY);
  } catch {}
}

function App() {
  const [apiKey, setApiKey] = useState(null);
  const [health, setHealth] = useState(null);
  const [view, setView] = useState('chat');
  const [currentThread, setCurrentThread] = useState(null);
  const [isMobile, setIsMobile] = useState(window.innerWidth < 1024);
  const [pendingCount, setPendingCount] = useState(0);
  const [bootChecked, setBootChecked] = useState(false);

  // Sprint 44 — auto-reconnect on load: try the stored key against /api/health.
  // If it's valid we skip the login screen entirely; if it's stale (e.g. token
  // was revoked from the home machine) we clear it and fall through to login.
  useEffect(() => {
    const stored = loadStoredKey();
    if (!stored) { setBootChecked(true); return; }
    let cancelled = false;
    fetch(`${API_BASE}/api/health`, { headers: { 'x-api-key': stored } })
      .then(r => {
        if (cancelled) return;
        if (r.ok) {
          r.json().then(h => { if (!cancelled) { setApiKey(stored); setHealth(h); } });
        } else {
          persistKey(null);   // stale credential — force re-login
        }
      })
      .catch(() => {})
      .finally(() => { if (!cancelled) setBootChecked(true); });
    return () => { cancelled = true; };
  }, []);

  // Sprint 44 — register the PWA service worker so "Add to Home Screen" gets
  // a real app-shell experience. Registration is best-effort; failures don't
  // affect normal browser usage.
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }, []);

  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 1024);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // Poll the pending-questions count every 60s so the badge stays current.
  // Only polls when authenticated.
  useEffect(() => {
    if (!apiKey) return;
    let cancelled = false;
    const refresh = () => {
      fetch(`${API_BASE}/api/questions/count`, { headers: { 'x-api-key': apiKey } })
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (!cancelled && d) setPendingCount(d.pending_count || 0); })
        .catch(() => {});
    };
    refresh();
    const id = setInterval(refresh, 60_000);
    return () => { cancelled = true; clearInterval(id); };
  }, [apiKey]);

  // Wait for the stored-key probe so we don't flash the login screen on a
  // refresh from a paired device.
  if (!bootChecked) {
    return <div className="min-h-screen flex items-center justify-center text-mute text-xs uppercase tracking-widest">Loading…</div>;
  }

  if (!apiKey) {
    return <LoginScreen onConnect={(k, h) => { persistKey(k); setApiKey(k); setHealth(h); }} />;
  }

  const renderView = () => {
    switch (view) {
      case 'chat':     return <ChatView apiKey={apiKey} currentThread={currentThread} setCurrentThread={setCurrentThread} onReconnect={setHealth} />;
      case 'threads':  return <ThreadsView apiKey={apiKey} setCurrentThread={setCurrentThread} setView={setView} />;
      case 'beliefs':  return <BeliefsView apiKey={apiKey} />;
      case 'docs':     return <DocumentsView apiKey={apiKey} />;
      case 'cache':    return <CacheView apiKey={apiKey} />;
      case 'refine':   return <RefineView apiKey={apiKey} onPendingChange={setPendingCount} />;
      case 'settings': return <SettingsView apiKey={apiKey} onLogout={() => { persistKey(null); setApiKey(null); }} health={health} />;
      default: return null;
    }
  };

  return (
    <div className={`min-h-screen flex ${isMobile ? 'flex-col pb-28' : ''}`}>
      {!isMobile && <Sidebar view={view} setView={setView} onLogout={() => { persistKey(null); setApiKey(null); }} isMobile={false} pendingCount={pendingCount} />}
      <main className="flex-1 min-w-0 lg:h-screen lg:overflow-y-auto">
        {renderView()}
      </main>
      {isMobile && <Sidebar view={view} setView={setView} onLogout={() => { persistKey(null); setApiKey(null); }} isMobile={true} pendingCount={pendingCount} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
