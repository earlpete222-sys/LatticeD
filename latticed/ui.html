<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LatticeD v3.1 - Legacy UI</title>
		<style>
					body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
					.container { max-width: 900px; margin: 0 auto; }
					.panel { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
					h1 { margin-top: 0; color: #38bdf8; font-size: 24px; }
					label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; }
					input[type="text"], input[type="password"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: white; box-sizing: border-box; margin-bottom: 15px; }
					button { background: #0ea5e9; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
					button:hover { background: #0284c7; }
					#status { display: inline-block; margin-left: 15px; font-weight: bold; }
					.disconnected { color: #ef4444; }
					.connected { color: #22c55e; }
					#output-stream { background: #0f172a; border: 1px solid #334155; height: 350px; overflow-y: auto; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; margin-top: 15px; }
					.node-tag { color: #f59e0b; font-weight: bold; }
				</style>
			</head>
		<body>
		<div class="container">
			<div class="panel">
				<h1>LatticeD v3.1 Control Panel (Legacy)</h1>

				<label for="apiKey">Step 1: Enter your LATTICED_SECRET Key</label>
				<input type="password" id="apiKey" value="local_dev_secret_123" placeholder="Enter password key here" />

					<button onclick="connectSystem()">Connect to Lattice</button>
					<span id="status" class="disconnected">🔴 Disconnected</span>
				</div>

			<div class="panel">
				<label for="promptInput">Step 2: Enter Strategy Objective</label>
				<input type="text" id="promptInput" placeholder="e.g., Check system memory and list active processes" onkeydown="if(event.key === 'Enter') sendObjective()" />
					<button onclick="sendObjective()">Execute Plan</button>

					<div id="output-stream">System logs will appear here when connected...</div>
				</div>
		</div>

		<script>
			let ws = null;

			function connectSystem() {
			const apiKey = document.getElementById('apiKey').value;
			const statusEl = document.getElementById('status');
			const logEl = document.getElementById('output-stream');

			if (ws) {
			ws.close();
			}

			logEl.innerHTML = "Attempting secure handshake with Sovereign Lattice...\n";

			// Dynamically establishes connection using the user-provided screen password
			ws = new WebSocket(`ws://${window.location.host}/ws?api_key=${encodeURIComponent(apiKey)}`);

			ws.onopen = () => {
			statusEl.innerText = "🟢 Connected";
			statusEl.className = "connected";
			logEl.innerHTML += "✅ Guardian authorized connection. Systems operational.\n";
			};

			ws.onmessage = (event) => {
				const data = JSON.parse(event.data);
				// Localized timestamp for each incoming event
				const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

				if (data.node) {
					const agentLabel = data.agent || data.node;
					logEl.innerHTML += `\n[${timestamp}] [<span class="node-tag">${agentLabel}</span>]: Processing task phase... State: ${data.status}`;
				} else if (data.phase === "Final") {
					logEl.innerHTML += `\n\n[${timestamp}] === EXECUTIVE SYNTHESIS ===\n${data.content}\n`;
				}
				logEl.scrollTop = logEl.scrollHeight; // Auto-scroll to bottom
			};

			ws.onclose = () => {
			statusEl.innerText = "🔴 Disconnected";
			statusEl.className = "disconnected";
			logEl.innerHTML += "\n❌ Connection closed or key rejected by System Guardian.";
			};

			ws.onerror = () => {
			logEl.innerHTML += "\n⚠️ Network error occurred. Ensure your Python script is running.";
			};
			}

			function sendObjective() {
			const promptInput = document.getElementById('promptInput');
			const logEl = document.getElementById('output-stream');

			if (!ws || ws.readyState !== WebSocket.OPEN) {
			alert("Please click 'Connect to Lattice' successfully first!");
			return;
			}

			if (!promptInput.value.trim()) return;

			const payload = {
			prompt: promptInput.value,
			thread_id: "main",
			path: "auto"
			};

			logEl.innerHTML = `🚀 Sending objective: "${promptInput.value}"\nWaiting for execution pipeline...`;
			ws.send(JSON.stringify(payload));
			promptInput.value = "";
			}
		</script>
	</body>
</html>
