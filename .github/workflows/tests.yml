name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python --version

      - name: Run sprint regression aggregator
        run: python tests/run_all.py

      - name: Smoke-test the MCP entry point
        if: runner.os != 'Windows'
        run: |
          (
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"ping"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"shutdown"}'
          ) | LATTICED_USER_ID=ci-test python scripts/latticed_mcp_server.py
